name: Retrieval LangGraph unit tests

on:
  push:
    branches:
      - dev/retrieval-repair-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional LangGraph only
        run: python -m pip install -r requirements-langgraph.txt
      - name: Compile retrieval modules
        run: python -m compileall -q Core/retrieval_nlp.py Core/graphs/retrieval_graph.py Core/retrieval_recovery.py
      - name: Run deterministic graph tests
        run: python -m unittest discover -s Tests -p 'test_langgraph_retrieval.py' -v
      - name: Run recovery tests without FAISS
        run: python -m unittest discover -s Tests -p 'test_retrieval_recovery.py' -v
      - name: Run source-boundary and inspect invariant tests
        run: python -m unittest discover -s Tests -p 'test_retrieval_invariants.py' -v
      - name: Compile real-corpus evaluator
        run: python -m py_compile tools/evaluate_langgraph_retrieval.py
