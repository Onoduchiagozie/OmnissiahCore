name: Retrieval LangGraph unit tests

on:
  push:
    branches:
      - dev/retrieval-repair-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional LangGraph only
        run: python -m pip install -r requirements-langgraph.txt
      - name: Compile retrieval modules
        run: python -m compileall -q Core/retrieval_nlp.py Core/graphs/retrieval_graph.py Core/retrieval_recovery.py
      - name: Validate prompt, agent, retriever and benchmark catalog
        run: |
          python -m py_compile Core/prompt.py Core/agent.py Core/retriever.py
          python -m json.tool app_text.json > /dev/null
          python -m json.tool tools/benchmarks/lore_query_catalog.json > /dev/null
      - name: Run deterministic graph tests
        run: python -m unittest discover -s Tests -p 'test_langgraph_retrieval.py' -v
      - name: Run recovery tests without FAISS
        run: python -m unittest discover -s Tests -p 'test_retrieval_recovery.py' -v
      - name: Run source-boundary and inspect invariant tests
        run: python -m unittest discover -s Tests -p 'test_retrieval_invariants.py' -v
      - name: Test persistent conversation session boundaries
        run: python -m unittest discover -s Tests -p 'test_conversation_store.py' -v
      - name: Compile session/runtime route integration
        run: python -m py_compile Core/conversation_store.py Api/services/runtime_service.py Api/routes/system_routes.py
      - name: Compile real-corpus evaluator
        run: python -m py_compile tools/evaluate_langgraph_retrieval.py
